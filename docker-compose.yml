services:
  app:
    image: "${DOCHUB_IMAGE:-dochub:latest}"
    environment:
      APP_ADDR: ":8080"
      DATABASE_URL: "${DATABASE_URL:?请在 .env 中设置外置 PostgreSQL 连接串}"
      STORAGE_DIR: /data
      WEB_DIR: /app/web
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      GIT_HOST_ALLOWLIST: ${GIT_HOST_ALLOWLIST:?请在 .env 中设置 GIT_HOST_ALLOWLIST}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL: ${SESSION_TTL:-168h}
      SSH_KEY_SOURCE: /run/secrets/git_ssh_key
      KNOWN_HOSTS_SOURCE: /run/secrets/git_known_hosts
    volumes:
      - "${DATA_DIR:-./data}:/data"
      - ${SSH_KEY_FILE:-${HOME}/.ssh/id_ed25519}:/run/secrets/git_ssh_key:ro
      - ${SSH_KNOWN_HOSTS_FILE:-${HOME}/.ssh/known_hosts}:/run/secrets/git_known_hosts:ro
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
